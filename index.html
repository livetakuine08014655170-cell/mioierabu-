<style>

<header><h1>mioCube → いえらぶ コピペ支援 v87</h1><p>最新テストPDFの文字列順を基準に抽出</p></header>

<section class="card">

<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

const $=id=>document.getElementById(id), out=$('out'), raw=$('raw'), status=$('status');
let data={}, tokens=[], compactAll='', equipmentCompact='', equipmentContinuation='';
const clean=s=>String(s??'').replace(/\u3000/g,' ').replace(/\s+/g,' ').trim();
const c=s=>clean(s).replace(/\s/g,'');
const findExact=(arr,s,start=0)=>{const q=c(s);for(let i=start;i<arr.length;i++)if(c(arr[i])===q)return i;return -1};
const valAfter=(arr,label,pred,limit=10)=>{let i=findExact(arr,label);if(i<0)return'';for(let j=i+1;j<Math.min(arr.length,i+1+limit);j++)if(pred(arr[j]))return clean(arr[j]);return''};
const onlyNum=s=>clean(s).replace(/,/g,'').replace(/[^\d.]/g,'');
let toastTimer=null;
function showCopied(btn){
 const z=$('toast');
 z.textContent='コピーしました';
 z.style.display='block';
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>z.style.display='none',1100);
 if(btn){
   const old=btn.textContent;
   btn.textContent='コピー済み ✓';
   btn.disabled=true;
   setTimeout(()=>{btn.textContent=old;btn.disabled=false},900);
 }
}
async function copy(t,btn){
 const text=String(t??'');
 if(!text)return;
 try{
   await navigator.clipboard.writeText(text);
   showCopied(btn);
 }catch(e){
   // Clipboard APIが使えない環境用のフォールバック
   const ta=document.createElement('textarea');
   ta.value=text;
   ta.style.position='fixed';
   ta.style.left='-9999px';
   document.body.appendChild(ta);
   ta.focus();
   ta.select();
   try{
     document.execCommand('copy');
     showCopied(btn);
   }finally{
     document.body.removeChild(ta);
   }
 }
}
const man=v=>{const n=Number(onlyNum(v));return n?String(n/10000).replace(/\.0+$/,''):''};

const equipGroups=[
["設備①",["上水道","下水道","浄化槽","都市ガス","プロパンガス","電気","バス・トイレ別室","インターネット対応","光ファイバー","CATV","室内洗濯機置き場","室外洗濯置場","ガスキッチン","IHコンロ","電気コンロ","コンロ2口以上"]],
["設備②",["楽器相談","ペット相談","保証人不要"]],
["設備③",["エレベーター","宅配ボックス","オール電化","バルコニー","角部屋"]],
["設備④",["フローリング","ロフト","メゾネット"]],
["設備⑤",["エアコン","冷房","暖房","家具家電付"]],
["設備⑥",["BS","CS","CATV","インターネット無料"]],
["設備⑦",["免震構造","デザイナーズ","バリアフリー","分譲賃貸"]],
["設備⑧",["向き"]],
["設備⑨",["駐輪場","バイク置き場","駐車場"]],
["設備⑩",["専用庭"]],
["設備⑪",["システムキッチン","カウンターキッチン","食洗器","ディスポーザー"]],
["設備⑫",["バス・トイレ別","バス・トイレ同室","バストイレ別室","洗面所独立","追い焚き","浴室乾燥","シャワー","温水洗浄便座"]],
["設備⑬",["床暖房"]],
["設備⑭",["ウォークインクローゼット","収納スペース","床下収納","トランクルーム"]],
["設備⑮",["オートロック","TVモニターホン","防犯カメラ","24時間セキュリティシステム"]],
["設備⑯",["建物階数","所在階"]],
["設備⑰",["リノベーション"]],
["設備⑱",["フリーレント"]]
];
const alias={
"浄化槽":["浄化槽","浄化漕"],"室内洗濯機置き場":["室内洗濯機置き場","室内洗濯置場"],"IHコンロ":["IHコンロ","ＩＨコンロ"],
"BS":["BSアンテナ","BS"],"CS":["CSアンテナ","CS"],"分譲賃貸":["分譲タイプ","分譲賃貸"],"食洗器":["食器洗い乾燥機","食洗器"],
"ウォークインクローゼット":["W・INクローゼット","ウォークインクローゼット"],"TVモニターホン":["ＴＶモニターホン","TVモニターホン"],
"バイク置き場":["バイク置場","バイク置き場"],"追い焚き":["追焚機能","追い焚き"],"家具家電付":["家具付き","家電付き","家具家電付"],
"バストイレ別室":["バス・トイレ別室","バストイレ別室"]
};
function eq(name){
 if(name==="向き") return data.direction||"";
 if(name==="駐車場") return data.parking_line||"";
 if(name==="建物階数") return data.total_floors||"";
 if(name==="所在階") return data.floor||"";
 return (alias[name]||[name]).some(a=>equipmentCompact.includes(c(a))) ? name : "";
}
function seirekiDate(x){
 const t=clean(x);
 const m=t.match(/(明治|大正|昭和|平成|令和)\s*(\d+|元)\s*年\s*(\d{1,2})?\s*月?/);
 if(!m)return t;
 const y=m[2]==='元'?1:Number(m[2]);
 const base={明治:1867,大正:1911,昭和:1925,平成:1988,令和:2018}[m[1]];
 const gy=base+y;
 return m[3]?`${gy}年${Number(m[3])}月`:`${gy}年`;
}

function conditionLabelBox(label){
 const items=(window.__visualItems&&window.__visualItems[0])||[];
 const exact=items.find(o=>c(o.text)===c(label));
 if(exact) return {x:exact.x,y:exact.y,w:exact.w||0};

 const rows=[];
 for(const it of items){
   let row=rows.find(r=>Math.abs(r.y-it.y)<=3);
   if(!row){row={y:it.y,items:[]};rows.push(row);}
   row.items.push(it);
 }
 for(const row of rows){
   const a=row.items.slice().sort((p,q)=>p.x-q.x);
   for(let i=0;i<a.length;i++){
     let joined='', endX=a[i].x+(a[i].w||0);
     for(let j=i;j<Math.min(a.length,i+5);j++){
       if(j>i && a[j].x-endX>24) break;
       joined+=c(a[j].text);
       endX=a[j].x+(a[j].w||0);
       if(joined===c(label)) return {x:a[i].x,y:row.y,w:endX-a[i].x};
       if(joined.length>c(label).length) break;
     }
   }
 }
 return null;
}

function conditionValue(label){
 const items=(window.__visualItems&&window.__visualItems[0])||[];
 const lab=conditionLabelBox(label);
 if(!lab)return '';
 const rightEdge=lab.x+lab.w;
 const nums=items.filter(o=>{
   const s=clean(o.text);
   return /^[\d,]+(?:\.\d+)?$/.test(s) &&
          Math.abs(o.y-lab.y)<=5 &&
          o.x>rightEdge+4 &&
          o.x-rightEdge<=130;
 }).sort((a,b)=>a.x-b.x);
 return nums.length?onlyNum(nums[0].text):'';
}

function applyConditionValues(r){
 const rent=conditionValue('賃料');
 if(rent!=='') r.rent=man(rent);
 r.deposit=conditionValue('保証金');
 r.shikikin=conditionValue('敷金');
 r.water_fee=conditionValue('水道料');
 r.insurance=conditionValue('保険料');
 r.management_fee=conditionValue('共益費');
 r.reikin=conditionValue('礼金');
 r.association_fee=conditionValue('町会費');
 r.key_fee=conditionValue('鍵交換代');
 r.renewal_fee=conditionValue('更新料');
}

// v53: 賃料備考は「備考」セルを座標で直接読む。
// 金額欄と違い複数行になるため、同じセル内の文字を上→下、左→右で連結する。
function rentNoteByPosition(){
 // v79: 条件欄の「備考」はラベル自身の高さを基準にして、
 // 上側の1行＋同じ高さの行＋下側の折返し行をまとめて取得する。
 // 「保証会社」はこの帳票では備考より上にあるため、境界判定には使わない。
 const items=(window.__visualItems&&window.__visualItems[0])||[];
 if(!items.length)return '';

 const norm=v=>c(clean(v.text??v.str??v));
 let labels=items.filter(it=>norm(it)==='備考').sort((a,b)=>Number(a.y||0)-Number(b.y||0));

 // PDFによって「備」「考」に分離される場合もあるので、最初の「備」も候補にする。
 if(!labels.length){
   labels=items.filter(it=>norm(it)==='備').sort((a,b)=>Number(a.y||0)-Number(b.y||0));
 }
 if(!labels.length)return '';

 // 1ページ目で最初に現れる備考ラベルが条件欄の賃料備考。
 for(const lab of labels){
   const lx=Number(lab.x||0), ly=Number(lab.y||0), lw=Number(lab.w||0);
   // 条件欄はページ右側。裏面・設備備考など別の「備考」を除外。
   if(lx < 430) continue;

   const left=lx+lw+4;
   // 実データでは本文1行目がラベル中心より約8px上、折返し末尾が約17px下。
   // 少し余裕を持たせて全行を拾う。
   const top=ly-18;
   const bottom=ly+32;

   const vals=items
     .filter(it=>{
       const x=Number(it.x||0), y=Number(it.y||0);
       return y>=top && y<bottom && x>left;
     })
     .sort((a,b)=>{
       const dy=Number(a.y||0)-Number(b.y||0);
       return Math.abs(dy)>3 ? dy : Number(a.x||0)-Number(b.x||0);
     })
     .map(it=>clean(it.text??it.str))
     .filter(Boolean)
     .filter(v=>{
       const n=norm(v);
       if(!n)return false;
       if(['備考','備','考','保証会社','契約期間'].includes(n))return false;
       if(n.includes('利用必須'))return false;
       return true;
     });

   let text=clean(vals.join(''));
   // v80: 備考の最終折返し行のすぐ下にある所在地まで拾う帳票がある。
   // 郵便番号が現れた時点で賃料備考セルは終了とみなし、それ以降を切る。
   // 例: ...フリーレント1ヶ月〒664-0006伊丹市... → ...フリーレント1ヶ月
   text=text.replace(/〒\s*\d{3}[-－ー]?\d{4}[\s\S]*$/,'').trim();
   // 賃料備考らしい文章だけ採用。保証会社行などの誤取得を防ぐ。
   if(text && /[\/／]|違約|クリーニング|保険|フリーレント|退去|入居|契約/.test(text)) return text;
 }
 return '';
}

function parkingRowData(){
 const items=(window.__visualItems&&window.__visualItems[0])||[];
 const page1=(window.__pageTokens&&window.__pageTokens[0])||[];
 const N=v=>String(v??'').normalize('NFKC').replace(/\s+/g,'').trim();
 const num=v=>{
   const m=N(v).match(/[\d,]+/);
   return m ? onlyNum(m[0]) : '';
 };

 let status='', deposit='', monthly='';

 // ------------------------------------------------------------
 // ① 文字列そのものから状態を取得
 // 「空有」は既存の正常動作を維持。「近隣確保」も同じ方式で拾う。
 // ------------------------------------------------------------
 for(const raw of page1){
   const t=N(raw);
   if(/近隣確保/.test(t)){ status='近隣確保'; break; }
   if(/空有|空あり/.test(t)){ status='空有'; break; }
 }

 // ------------------------------------------------------------
 // ② 駐車場ブロック内の「保証金」「月額」ラベルを座標で直接探す
 // 数字の並び順では決めない。これで「15,000」と所在階「2」の混同を防ぐ。
 // ------------------------------------------------------------
 let parkingLabel=null;
 for(const o of items){
   if(N(o.text)==='駐車場'){ parkingLabel=o; break; }
 }

 let block=items;
 if(parkingLabel){
   block=items.filter(o=>{
     const dx=o.x-parkingLabel.x;
     const dy=o.y-parkingLabel.y;
     return dx>-70 && dx<300 && dy>-15 && dy<120;
   });
 }

 const findLabel=(word)=>{
   const exact=block.filter(o=>N(o.text)===word);
   if(exact.length) return exact[0];

   // 「保 証 金」のように分割された場合を横並び結合
   const rows=[];
   for(const it of block){
     let row=rows.find(r=>Math.abs(r.y-it.y)<=3);
     if(!row){ row={y:it.y,items:[]}; rows.push(row); }
     row.items.push(it);
   }
   for(const row of rows){
     const a=row.items.slice().sort((p,q)=>p.x-q.x);
     for(let i=0;i<a.length;i++){
       let joined='', x0=a[i].x, endX=a[i].x+(a[i].w||0);
       for(let j=i;j<Math.min(a.length,i+6);j++){
         if(j>i && a[j].x-endX>24) break;
         joined+=N(a[j].text);
         endX=a[j].x+(a[j].w||0);
         if(joined===word) return {text:word,x:x0,y:row.y,w:endX-x0};
         if(joined.length>word.length) break;
       }
     }
   }
   return null;
 };

 const nearestNumberToLabel=(lab)=>{
   if(!lab) return '';
   const candidates=block.filter(o=>{
     const t=N(o.text);
     if(!/[\d]/.test(t)) return false;
     // 金額値はラベルの右側または少し下側にあるものだけ
     const dx=o.x-lab.x;
     const dy=o.y-lab.y;
     return dx>-15 && dx<180 && dy>-18 && dy<55;
   }).map(o=>{
     const dx=Math.max(0,o.x-lab.x);
     const dy=Math.abs(o.y-lab.y);
     const score=dy*4+dx;
     return {o,score,n:num(o.text)};
   }).filter(x=>x.n)
     // 階数や面積などの小さい数字を誤拾いしにくくする。
     // 駐車料金は通常100円以上。ラベル直結なら小額も許容する。
     .sort((a,b)=>a.score-b.score);

   if(!candidates.length) return '';
   return candidates[0].n;
 };

 const depLab=findLabel('保証金');
 const monLab=findLabel('月額');

 deposit=nearestNumberToLabel(depLab);
 monthly=nearestNumberToLabel(monLab);

 // ------------------------------------------------------------
 // ③ 同一トークン・近接トークンのフォールバック
 // 「近隣確保 ｜ 保証金：15,000円 ｜ 月額：2円」のような完成形にも対応
 // ------------------------------------------------------------
 const joined=page1.map(x=>clean(x)).join(' ').normalize('NFKC');

 if(!status){
   if(/近隣確保/.test(joined)) status='近隣確保';
   else if(/空有|空あり/.test(joined)) status='空有';
 }

 if(!deposit){
   const m=joined.match(/保証金\s*[:：]?\s*([\d,]+)\s*円?/);
   if(m) deposit=onlyNum(m[1]);
 }
 if(!monthly){
   const m=joined.match(/月額\s*[:：]?\s*([\d,]+)\s*円?/);
   if(m) monthly=onlyNum(m[1]);
 }

 // ------------------------------------------------------------
 // ④ 空有だけは従来どおり「状態の直後の金額」を最終保険にする。
 // 近隣確保では保証金と月額が複数あるため、この推測はしない。
 // ------------------------------------------------------------
 if(status==='空有' && !monthly){
   for(let i=0;i<page1.length;i++){
     const cur=N(page1[i]);
     if(!/空有|空あり/.test(cur)) continue;

     const same=cur.match(/(?:空有|空あり)[^\d]{0,15}([\d,]+)/);
     if(same){ monthly=onlyNum(same[1]); break; }

     const near=page1.slice(i+1,i+8).map(N);
     const mIdx=near.findIndex(x=>/月額/.test(x));
     if(mIdx>=0){
       const mm=near[mIdx].match(/月額\s*[:：]?\s*([\d,]+)/);
       if(mm){ monthly=onlyNum(mm[1]); break; }
       const nxt=near.slice(mIdx+1,mIdx+3).find(x=>/^[\d,]+\s*円?$/.test(x));
       if(nxt){ monthly=num(nxt); break; }
     }
     const firstMoney=near.find(x=>/^[\d,]{3,}\s*円?$/.test(x));
     if(firstMoney){ monthly=num(firstMoney); break; }
   }
 }

 return {status,deposit:'',monthly};
}
function parkingOneLine(){
 const p=parkingRowData(),a=[];
 const pyen=v=>{
   const s=String(v??'').replace(/,/g,'').trim();
   if(!s)return '';
   const n=Number(s);
   return Number.isFinite(n) ? n.toLocaleString('ja-JP')+'円' : '';
 };
 if(p.status) a.push(p.status);
 const dep=pyen(p.deposit);
 const mon=pyen(p.monthly);
 if(dep) a.push('保証金：'+dep);
 if(mon) a.push('月額：'+mon);
 return a.join(' ｜ ');
}

function guaranteeTwoRows(){
 const page1=(window.__pageTokens&&window.__pageTokens[0])||[];
 let idx=page1.findIndex(x=>clean(x).includes('利用必須'));
 if(idx<0)return {company:'',fee:''};

 let company='';
 let fee='';

 const first=clean(page1[idx]);
 const stripped=clean(first.replace(/利用必須/g,''));

 if(stripped){
   company=stripped;
 }else{
   for(let i=idx+1;i<Math.min(page1.length,idx+5);i++){
     const v=clean(page1[i]);
     if(!v)continue;
     if(v==='円'||v==='年'||/^[\d,]+$/.test(v))continue;
     if(v==='交'||v==='通'||v==='所在地'||v==='最寄駅')break;
     company=v;
     idx=i;
     break;
   }
 }

 // 「金額記載あり」の保証料説明だけ採用。
 // 賃料備考の「初回保証料家主負担」等を誤取得しない。
 for(let i=idx+1;i<Math.min(page1.length,idx+8);i++){
   const v=clean(page1[i]);
   if(!v)continue;
   if(v==='交'||v==='通'||v==='所在地'||v==='最寄駅')break;
   if(company && v===company)continue;

   const hasAmount=/\d|[０-９]|％|%/.test(v);
   const looksFee=/保証料|利用料|手数料|賃料総額|月額賃料|毎月|月々|口座振替/.test(v);
   const looksRentNote=/家主負担|貸主負担|フリーレント|鍵交換|クリーニング|違約金/.test(v);

   if(hasAmount && looksFee && !looksRentNote){
     fee=v;
     break;
   }
 }

 return {company:clean(company),fee:clean(fee)};
}

// v87: 交通欄だけを既存の文字位置情報で読む。判別不能時は駅徒歩としない。
function extractTrafficAccess(){
 const result={traffic_mode:'不明',station_walk_min:'',bus_min:'',bus_stop:'',bus_stop_walk_min:''};
 const label=conditionLabelBox('最寄駅'), bottom=conditionLabelBox('間取り');
 if(!label || !bottom || bottom.y<=label.y) return result;
 const norm=s=>String(s??'').normalize('NFKC').replace(/\s/g,'');
 const items=((window.__visualItems&&window.__visualItems[0])||[]).filter(i=>
   i.x>label.x+label.w && i.y>=label.y-12 && i.y<bottom.y-4 && norm(i.text));
 const rows=[];
 items.forEach(i=>{let row=rows.find(r=>Math.abs(r.y-i.y)<=3);if(!row){row={y:i.y,items:[]};rows.push(row);}row.items.push(i);});
 const lines=rows.sort((a,b)=>a.y-b.y).map(r=>r.items.sort((a,b)=>a.x-b.x).map(i=>norm(i.text)).join(''));
 const text=lines.join('\n');
 const bus=/バス|停下車|バス停/.test(text);
 const walks=[...text.matchAll(/徒歩(\d{1,3})分/g)];
 const minutes=walks.length===1?walks[0][1]:'';
 if(bus){
   result.traffic_mode='バス';
   result.bus_min=text.match(/バス(\d{1,3})分/)?.[1]||'';
   const line=lines.find(x=>/停下車/.test(x))||'';
   result.bus_stop=line.replace(/^.*?バス\d+分/,'').replace(/停下車.*$/,'');
   result.bus_stop_walk_min=minutes;
 }else if(minutes && lines.some(x=>/駅/.test(x))){
   result.traffic_mode='徒歩';result.station_walk_min=minutes;
 }
 return result;
}

 // のように細かく分割しても、最大4トークン結合して判定する。
 const normalizeLayoutToken=v=>String(v??'').normalize('NFKC').replace(/\s+/g,'').toUpperCase();
 r.layout='';
 let li=-1;

 const layoutFromString=(raw)=>{
   const n=normalizeLayoutToken(raw);
   const m=n.match(/^(\d+)(LDK|DK|K|L|D|S|R)$/);
   return m ? m[1]+m[2] : '';
 };

 const scanLayoutTokens=(arr, baseIndex=0)=>{
   for(let i=0;i<arr.length;i++){
     for(let len=1;len<=4 && i+len<=arr.length;len++){
       const joined=arr.slice(i,i+len).map(normalizeLayoutToken).join('');
       const got=layoutFromString(joined);
       if(got) return {layout:got,index:baseIndex+i};
     }

     // 「3DK南」のように末尾に向き等がくっついた場合
     const one=normalizeLayoutToken(arr[i]);
     const m=one.match(/^(\d+)(LDK|DK|K|L|D|S|R)(?:東|西|南|北|北東|北西|南東|南西)?$/);
     if(m) return {layout:m[1]+m[2],index:baseIndex+i};
   }
   return null;
 };

function buildIelovePayload(){
  // v58:
  // 上側の基本情報は従来どおり「値がある項目だけ」渡す。
  // 金額以下 + 今回追加した建物前半は MIO完全正 のため、
  // 空欄も必ずキーとして渡し、いえらぶ側の古い値を消せるようにする。
  const upperKeys=[
    'property_no','property_name','room_no','address','status','building_type'
  ];

  const authoritativeKeys=[
    'rent','management_fee','shikikin','reikin','deposit',
    'renewal_fee',
    'guarantee_company','guarantee_fee',
    'insurance',
    'water_fee','association_fee',
    'key_fee',

    // 建物前半
    'structure',
    'area',
    'total_floors',
    'basement_floors',
    'built_date',

    // 駐車場・部屋間取り
    'parking_line',
    'floor',
    'direction',
    'layout',
    'corner_room'
  ];

  const payload={_type:'mioCube-ielove',_version:15};
  ['traffic_station','traffic_mode','station_walk_min','bus_min','bus_stop','bus_stop_walk_min'].forEach(k=>{payload[k]=String(data[k]??'').trim();});
  ['school_city','elementary_school','junior_high_school','school_note'].forEach(k=>{
    payload[k]=data[k] == null ? '' : String(data[k]).trim();
  });

  // v70: 取引情報・備考/ポータル連携用。
  // 取引態様は「仲介」「先物自社物」のときだけいえらぶ側で使用。
  // 元付会社名は broker_name、確認表示は rent_notes / equipment_notes / back_comment を使用。
  ['mediation','broker_name','rent_notes','equipment_notes','back_comment'].forEach(k=>{
    payload[k]=data[k] == null ? '' : String(data[k]).trim();
  });

  upperKeys.forEach(k=>{
    const v = data[k] == null ? '' : String(data[k]).trim();
    if(v !== '') payload[k]=v;
  });

  authoritativeKeys.forEach(k=>{
    // basement_floors は現行PDFから独立取得していないため空欄。
    // MIO完全正ルールにより、いえらぶ側の地下階数はクリア対象。
    if(k === 'basement_floors'){
      payload[k] = data[k] == null ? '' : String(data[k]).trim();
      return;
    }
    payload[k] = data[k] == null ? '' : String(data[k]).trim();
  });

  // v65: ⑤設備はMIO完全正。
  // 現在の⑤設備表示でONになっている正規化済み項目を配列で渡す。
  const equipmentTerms=[];
  equipGroups.forEach(([groupName,list])=>{
    list.forEach(name=>{
      // 建物階数・所在階・向き・駐車場は設備同期対象ではないので除外
      if(['建物階数','所在階','向き','駐車場'].includes(name)) return;
      if(eq(name) && !equipmentTerms.includes(name)) equipmentTerms.push(name);
    });
  });
  payload.equipment_terms=equipmentTerms;

  // 角部屋は equipment_terms を唯一の判定元にする。
  // ④建物の corner_room も⑤設備と同じ結果を渡す。
  payload.corner_room=equipmentTerms.includes('角部屋')?'角部屋':'';

  return payload;
}
async function copyIelovePayload(){
  const payload=buildIelovePayload();
  if(Object.keys(payload).length<=2) return;
  await copy(JSON.stringify(payload), $('copyIelove'));
}

async function load(file){
 const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
 tokens=[]; let ptxt=[]; window.__pageTokens=[]; window.__visualItems=[];
 for(let p=1;p<=pdf.numPages;p++){
   const page=await pdf.getPage(p),tc=await page.getTextContent();
   const viewport=page.getViewport({scale:1});
   const visual=tc.items.map(i=>{
     const m=pdfjsLib.Util.transform(viewport.transform,i.transform);
     return {text:clean(i.str),x:Number(m[4]||0),y:Number(m[5]||0),w:Number(i.width||0)};
   }).filter(i=>i.text);
   const a=visual.map(i=>i.text);
   window.__pageTokens.push(a);
   window.__visualItems.push(visual);
   if(p>1)tokens.push('__PAGEBREAK__');
   tokens.push(...a);
   ptxt.push(`【PAGE ${p}】\n`+a.join('\n'));
 }
 compactAll=c(tokens.join(''));
 // v83: 設備判定はPDF全体ではなく、1ページ目の「●設備」ブロックだけを対象にする。
 // 最初の●から最後の●までを設備本体とし、その後の設備備考や裏面コメントは判定に使わない。
 const p1tokens=(window.__pageTokens&&window.__pageTokens[0])||[];
 let eqFirst=-1, eqLast=-1;
 for(let i=0;i<p1tokens.length;i++){
   if(String(p1tokens[i]).includes('●')){
     if(eqFirst<0) eqFirst=i;
     eqLast=i;
   }
 }
 equipmentContinuation='';
 equipmentCompact=(eqFirst>=0 && eqLast>=eqFirst)
   ? c(p1tokens.slice(eqFirst,eqLast+1).join(''))
   : '';
 // v84: 最終●項目の未完部分だけを、既存の設備語・別名と照合して補完する。
 // 続きの先頭が一致する場合だけ採用し、設備備考全体や2ページ目は検索しない。
 if(eqLast>=0){
   const tail=c(String(p1tokens[eqLast]).split('●').pop());
   const terms=[...new Set(equipGroups.flatMap(([,names])=>names.flatMap(name=>alias[name]||[name])).map(c))];
   const candidates=terms.filter(term=>term.startsWith(tail) && term.length>tail.length);
   let continuation='', completed='';
   for(let i=eqLast+1;candidates.length && i<p1tokens.length;i++){
     continuation+=c(p1tokens[i]);
     const matched=candidates.filter(term=>continuation.startsWith(term.slice(tail.length)));
     if(matched.length){
       completed=matched.sort((a,b)=>b.length-a.length)[0].slice(tail.length);
       break;
     }
     if(!candidates.some(term=>term.slice(tail.length).startsWith(continuation))) break;
   }
   equipmentCompact+=completed;
   equipmentContinuation=completed;
 }
 raw.textContent=ptxt.join('\n\n');
 data=parse();
 render();
 status.textContent='読み込み完了。項目へ反映しました。';
 status.style.display='block';
}
